<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Research Agent</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0a0e14;
            --panel: #10151f;
            --line: #1e2734;
            --line-bright: #2a3644;
            --ink: #d7dee8;
            --ink-dim: #7d8ba0;
            --signal: #ffb454;
            --ok: #5fd88f;
            --err: #ff6b6b;
            --warn: #ffb454;
            --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
        }

        body {
            font-family: var(--sans);
            background:
                linear-gradient(180deg, rgba(255, 180, 84, 0.04), transparent 220px),
                var(--bg);
            color: var(--ink);
            min-height: 100vh;
            padding: 32px 24px 64px;
        }

        .wrap {
            max-width: 760px;
            margin: 0 auto;
        }

        header {
            border-bottom: 1px solid var(--line);
            padding-bottom: 20px;
            margin-bottom: 28px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        h1 {
            font-family: var(--mono);
            color: var(--ink);
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        h1::before {
            content: "> ";
            color: var(--signal);
        }

        .subtitle {
            color: var(--ink-dim);
            font-size: 0.8rem;
            font-family: var(--mono);
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 3px;
            padding: 22px 24px;
            margin-bottom: 16px;
            position: relative;
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: var(--line-bright);
            border-radius: 3px 0 0 3px;
        }

        label {
            display: block;
            color: var(--ink-dim);
            font-size: 0.78rem;
            margin-bottom: 6px;
            font-family: var(--mono);
        }

        input,
        select,
        textarea {
            width: 100%;
            background: #060a10;
            border: 1px solid var(--line);
            color: var(--ink);
            padding: 10px 13px;
            border-radius: 3px;
            font-size: 0.92rem;
            outline: none;
            font-family: var(--sans);
            transition: border-color 0.15s ease;
        }

        input::placeholder {
            color: #4a5568;
        }

        input:focus,
        select:focus {
            border-color: var(--signal);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .btn {
            background: var(--signal);
            color: #1a1206;
            border: none;
            padding: 11px 22px;
            border-radius: 3px;
            font-size: 0.88rem;
            cursor: pointer;
            font-weight: 700;
            font-family: var(--mono);
            letter-spacing: 0.01em;
            transition: filter 0.15s ease;
        }

        .btn:hover {
            filter: brightness(1.1);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: none;
        }

        .btn-secondary {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--line-bright);
            font-weight: 600;
        }

        .btn-secondary:hover {
            border-color: var(--signal);
            background: rgba(255, 180, 84, 0.06);
            filter: none;
        }

        .status {
            padding: 5px 12px;
            border-radius: 3px;
            font-size: 0.78rem;
            display: inline-block;
            font-family: var(--mono);
            border: 1px solid transparent;
        }

        .status-pending {
            background: rgba(125, 139, 160, 0.12);
            color: var(--ink-dim);
            border-color: var(--line-bright);
        }

        .status-done {
            background: rgba(95, 216, 143, 0.1);
            color: var(--ok);
            border-color: rgba(95, 216, 143, 0.3);
        }

        .status-error {
            background: rgba(255, 107, 107, 0.1);
            color: var(--err);
            border-color: rgba(255, 107, 107, 0.3);
        }

        .status-blocked {
            background: rgba(255, 180, 84, 0.1);
            color: var(--warn);
            border-color: rgba(255, 180, 84, 0.3);
        }

        #report-box {
            background: #060a10;
            border: 1px solid var(--line);
            border-radius: 3px;
            padding: 16px 18px;
            font-size: 0.88rem;
            line-height: 1.65;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            font-family: var(--sans);
        }

        #diff-box {
            background: #060a10;
            border: 1px solid var(--line);
            border-radius: 3px;
            padding: 14px 16px;
            font-size: 0.82rem;
            white-space: pre-wrap;
            color: var(--ink-dim);
            font-family: var(--mono);
        }

        .diff-new {
            color: var(--ok);
        }

        .diff-removed {
            color: var(--err);
        }

        #session-box {
            font-size: 0.85rem;
        }

        .msg {
            padding: 9px 13px;
            border-radius: 3px;
            margin-bottom: 8px;
            max-width: 80%;
            border: 1px solid var(--line);
            font-size: 0.87rem;
        }

        .msg-user {
            background: #0d1420;
            margin-left: auto;
            border-color: var(--line-bright);
        }

        .msg-assistant {
            background: var(--panel);
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        #spinner {
            display: none;
            width: 13px;
            height: 13px;
            border: 2px solid rgba(0, 0, 0, 0.25);
            border-top-color: #1a1206;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-left: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .section-title {
            color: var(--ink);
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 18px;
            font-family: var(--mono);
            text-transform: lowercase;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-title span.tag {
            color: var(--signal);
        }

        @media (max-width: 560px) {
            .row {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <h1>Autonomous Research Agent</h1>
            <p class="subtitle">LangGraph · TensorZero · AWS Bedrock Guardrails</p>
        </header>

        <div class="card">
            <div class="section-title">authentication</div>
            <div style="display:flex;gap:10px;align-items:flex-end">
                <div style="flex:1">
                    <label>API Key</label>
                    <input type="password" id="api-key" placeholder="Enter your X-API-Key (saved in browser)">
                </div>
                <button class="btn btn-secondary" onclick="saveApiKey()" style="white-space:nowrap">Save Key</button>
            </div>
            <div id="key-status" style="font-size:0.78rem;color:var(--ink-dim);margin-top:8px;font-family:var(--mono)">
            </div>
        </div>

        <div class="card">
            <div class="section-title">new research job</div>
            <div style="margin-bottom:16px">
                <label>Research Topic</label>
                <input type="text" id="topic" placeholder="e.g. Quantum computing advances in 2024">
            </div>
            <div class="row">
                <div>
                    <label>Output Format</label>
                    <select id="format">
                        <option value="text">Plain Text</option>
                        <option value="pdf">PDF Export</option>
                        <option value="json">Structured JSON</option>
                    </select>
                </div>
                <div>
                    <label>Session ID (optional)</label>
                    <input type="text" id="session-id" placeholder="Leave blank to auto-generate">
                </div>
            </div>
            <button class="btn" onclick="submitResearch()" id="submit-btn">
                Start Research
                <span id="spinner"></span>
            </button>
        </div>

        <div class="card" id="result-card" style="display:none">
            <div class="section-title">result</div>
            <div style="margin-bottom:12px">
                <span id="job-status" class="status status-pending">Pending</span>
                <span style="color:var(--ink-dim);font-size:0.78rem;margin-left:10px;font-family:var(--mono)"
                    id="job-id-label"></span>
            </div>
            <div id="report-box" style="display:none"></div>
            <div class="actions" id="export-actions" style="display:none">
                <button class="btn btn-secondary" onclick="downloadPDF()">Download PDF</button>
                <button class="btn btn-secondary" onclick="copyJSON()">Copy JSON</button>
                <button class="btn btn-secondary" onclick="loadDiff()">Show Changes vs Previous</button>
            </div>
            <div id="diff-box" style="display:none;margin-top:14px"></div>
        </div>

        <div class="card">
            <div class="section-title">session history
                <button class="btn btn-secondary" style="font-size:0.75rem;padding:5px 12px"
                    onclick="newSession()">New Session</button>
            </div>
            <p style="color:var(--ink-dim);font-size:0.78rem;margin-bottom:14px;margin-top:-10px">Session ID is
                auto-reused across requests so history builds up. Click "New Session" to start fresh.</p>
            <div id="session-box">
                <p style="color:var(--ink-dim);font-size:0.85rem">No session active.</p>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.hostname === 'localhost' ? 'http://localhost:8000' : '';
        let currentJobId = null;
        let currentSessionId = null;
        let pollInterval = null;
        let lastReport = null;
        let lastTopic = null;

        function getApiKey() {
            return localStorage.getItem('research_agent_api_key') || '';
        }

        function authHeaders() {
            const key = getApiKey();
            return key ? { 'Content-Type': 'application/json', 'X-API-Key': key }
                : { 'Content-Type': 'application/json' };
        }

        function saveApiKey() {
            const key = document.getElementById('api-key').value.trim();
            if (key) {
                localStorage.setItem('research_agent_api_key', key);
                document.getElementById('key-status').textContent = 'API key saved.';
                document.getElementById('key-status').style.color = '#5fd88f';
            } else {
                localStorage.removeItem('research_agent_api_key');
                document.getElementById('key-status').textContent = 'API key cleared.';
                document.getElementById('key-status').style.color = '#7d8ba0';
            }
        }

        // Restore key indicator on load
        window.addEventListener('DOMContentLoaded', () => {
            if (getApiKey()) {
                document.getElementById('key-status').textContent = 'API key loaded from browser storage.';
                document.getElementById('key-status').style.color = '#5fd88f';
            }
        });

        async function submitResearch() {
            const topic = document.getElementById('topic').value.trim();
            if (!topic) return alert('Please enter a research topic.');
            const format = document.getElementById('format').value;
            const sessionId = document.getElementById('session-id').value.trim();

            document.getElementById('submit-btn').disabled = true;
            document.getElementById('spinner').style.display = 'inline-block';
            document.getElementById('result-card').style.display = 'block';
            document.getElementById('job-status').className = 'status status-pending';
            document.getElementById('job-status').textContent = 'Submitting...';
            document.getElementById('report-box').style.display = 'none';
            document.getElementById('export-actions').style.display = 'none';
            document.getElementById('diff-box').style.display = 'none';

            try {
                const resp = await fetch(`${API}/research`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: JSON.stringify({ topic, output_format: format, session_id: sessionId }),
                });
                if (!resp.ok) {
                    const err = await resp.json();
                    throw new Error(err.detail || 'Request failed');
                }
                const data = await resp.json();
                currentJobId = data.job_id;
                currentSessionId = data.session_id;
                lastTopic = topic;
                document.getElementById('session-id').value = currentSessionId;
                document.getElementById('job-id-label').textContent = `Job: ${currentJobId}`;
                document.getElementById('job-status').className = 'status status-pending';
                document.getElementById('job-status').textContent = 'Processing...';
                if (pollInterval) clearInterval(pollInterval);
                pollInterval = setInterval(pollResult, 3000);
            } catch (e) {
                document.getElementById('job-status').className = 'status status-error';
                document.getElementById('job-status').textContent = `Error: ${e.message}`;
                document.getElementById('submit-btn').disabled = false;
                document.getElementById('spinner').style.display = 'none';
            }
        }

        async function pollResult() {
            if (!currentJobId) return;
            try {
                const resp = await fetch(`${API}/result/${currentJobId}`, { headers: authHeaders() });
                const data = await resp.json();
                if (data.status === 'pending') return;
                clearInterval(pollInterval);
                document.getElementById('submit-btn').disabled = false;
                document.getElementById('spinner').style.display = 'none';

                if (data.status === 'done') {
                    lastReport = data;
                    document.getElementById('job-status').className = 'status status-done';
                    document.getElementById('job-status').textContent = 'Complete';
                    document.getElementById('report-box').textContent = data.report;
                    document.getElementById('report-box').style.display = 'block';
                    document.getElementById('export-actions').style.display = 'flex';
                    loadSession();
                } else if (data.status === 'blocked') {
                    document.getElementById('job-status').className = 'status status-blocked';
                    document.getElementById('job-status').textContent = `Blocked: ${data.error}`;
                } else {
                    document.getElementById('job-status').className = 'status status-error';
                    document.getElementById('job-status').textContent = `Error: ${data.error}`;
                }
            } catch (e) {
                console.error('Poll error', e);
            }
        }

        async function downloadPDF() {
            if (!currentJobId) return;
            const a = document.createElement('a');
            a.href = `${API}/result/${currentJobId}/pdf`;
            a.download = `report-${currentJobId}.pdf`;
            a.click();
        }

        function copyJSON() {
            if (!lastReport || !lastTopic) return;
            const json = JSON.stringify({
                report_id: currentJobId,
                topic: lastTopic,
                report: lastReport.report,
                structured: lastReport.structured || null,
            }, null, 2);
            navigator.clipboard.writeText(json).then(() => alert('JSON copied to clipboard.'));
        }

        async function loadDiff() {
            if (!lastTopic) return;
            const resp = await fetch(`${API}/diff/${encodeURIComponent(lastTopic)}`, { headers: authHeaders() });
            const data = await resp.json();
            const box = document.getElementById('diff-box');
            box.style.display = 'block';
            const diff = data.diff || 'No previous report found.';
            box.innerHTML = diff.split('\n').map(line => {
                const esc = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                if (line.startsWith('+++') || line.startsWith('---')) return `<span style="color:#58a6ff;font-weight:600">${esc}</span>`;
                if (line.startsWith('@@')) return `<span style="color:#d29922">${esc}</span>`;
                if (line.startsWith('+')) return `<span class="diff-new">${esc}</span>`;
                if (line.startsWith('-')) return `<span class="diff-removed">${esc}</span>`;
                return `<span>${esc}</span>`;
            }).join('\n');
        }

        async function loadSession() {
            if (!currentSessionId) return;
            const resp = await fetch(`${API}/session/${currentSessionId}`, { headers: authHeaders() });
            const data = await resp.json();
            const box = document.getElementById('session-box');
            if (!data.messages || data.messages.length === 0) {
                box.innerHTML = '<p style="color:#8b949e;font-size:0.85rem">No messages yet.</p>';
                return;
            }
            box.innerHTML = data.messages.map(m =>
                `<div class="msg msg-${m.role}"><strong style="text-transform:capitalize">${m.role}</strong>: ${m.content}</div>`
            ).join('');
        }

        function newSession() {
            currentSessionId = null;
            document.getElementById('session-id').value = '';
            document.getElementById('session-box').innerHTML = '<p style="color:#8b949e;font-size:0.85rem">No session active.</p>';
        }
    </script>
</body>

</html>
